<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Selection Workspace | PhotoMagic by RK</title>
  <meta name="description" content="Manage and reorder your chosen photos for album printing with real-time drag and drop and auto-save." />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/design-system.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/dashboard.css" />
  <link rel="stylesheet" href="./css/selection.css" />
</head>
<body>
  <!-- Main Application Container -->
  <div id="selection-app">
    <!-- Initial Loading Skeleton Shell -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #0B0B0C; color: #D4AF37; font-family: 'Cormorant Garamond', serif; font-size: 1.75rem;">
      <div style="text-align: center;">
        <div style="width: 48px; height: 48px; border: 3px solid rgba(212, 175, 55, 0.2); border-top-color: #D4AF37; border-radius: 50%; margin: 0 auto 16px auto; animation: spin 1s infinite linear;"></div>
        Loading Selection Workspace...
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Modular JavaScript Application Entry -->
  <script type="module" src="./js/selection-app.js"></script>
</body>
</html>
